<svg xmlns="http://www.w3.org/2000/svg" width="400" height="533" viewBox="0 0 400 533">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0508"/>
      <stop offset="100%" style="stop-color:#3d0a14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="533" fill="url(#bg)"/>
  <rect width="400" height="200" y="0" fill="url(#glow)"/>
  <!-- decorative grid lines -->
  <line x1="0" y1="133" x2="400" y2="133" stroke="#e94560" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="0" y1="266" x2="400" y2="266" stroke="#e94560" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="0" y1="399" x2="400" y2="399" stroke="#e94560" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="533" stroke="#e94560" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="533" stroke="#e94560" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="533" stroke="#e94560" stroke-opacity="0.1" stroke-width="1"/>
  <!-- eagle symbol -->
  <text x="200" y="220" font-family="serif" font-size="100" fill="#e94560" fill-opacity="0.6" text-anchor="middle">🦅</text>
  <!-- title -->
  <text x="200" y="340" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#f0f0f0" text-anchor="middle">ASSASSIN'S CREED</text>
  <text x="200" y="370" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#e94560" text-anchor="middle">MIRAGE</text>
  <!-- border -->
  <rect x="2" y="2" width="396" height="529" fill="none" stroke="#e94560" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="10" y="10" width="380" height="513" fill="none" stroke="#e94560" stroke-opacity="0.15" stroke-width="1"/>
</svg>
