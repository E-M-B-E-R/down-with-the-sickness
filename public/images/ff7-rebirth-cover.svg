<svg xmlns="http://www.w3.org/2000/svg" width="400" height="533" viewBox="0 0 400 533">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#061525"/>
      <stop offset="100%" style="stop-color:#0a2540"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4cc9f0;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#4cc9f0;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="533" fill="url(#bg)"/>
  <rect width="400" height="220" y="0" fill="url(#glow)"/>
  <!-- decorative lines -->
  <line x1="0" y1="100" x2="400" y2="100" stroke="#4cc9f0" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="200" x2="400" y2="200" stroke="#4cc9f0" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="300" x2="400" y2="300" stroke="#4cc9f0" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="400" x2="400" y2="400" stroke="#4cc9f0" stroke-opacity="0.08" stroke-width="1"/>
  <!-- symbol -->
  <text x="200" y="220" font-family="serif" font-size="100" fill="#4cc9f0" fill-opacity="0.5" text-anchor="middle">⚔️</text>
  <!-- title -->
  <text x="200" y="330" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#a0d8ef" text-anchor="middle" letter-spacing="3">FINAL FANTASY VII</text>
  <text x="200" y="362" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#4cc9f0" text-anchor="middle" letter-spacing="2">REBIRTH</text>
  <!-- border -->
  <rect x="2" y="2" width="396" height="529" fill="none" stroke="#4cc9f0" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="10" y="10" width="380" height="513" fill="none" stroke="#4cc9f0" stroke-opacity="0.15" stroke-width="1"/>
</svg>
