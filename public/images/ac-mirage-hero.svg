<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="400" viewBox="0 0 1400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0205"/>
      <stop offset="50%" style="stop-color:#1a0508"/>
      <stop offset="100%" style="stop-color:#3d0a14"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.2"/>
      <stop offset="50%" style="stop-color:#e94560;stop-opacity:0.05"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="400" fill="url(#bg)"/>
  <rect width="1400" height="400" fill="url(#fade)"/>
  <!-- horizontal lines -->
  <line x1="0" y1="100" x2="1400" y2="100" stroke="#e94560" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="200" x2="1400" y2="200" stroke="#e94560" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="0" y1="300" x2="1400" y2="300" stroke="#e94560" stroke-opacity="0.08" stroke-width="1"/>
  <!-- vertical lines -->
  <line x1="350" y1="0" x2="350" y2="400" stroke="#e94560" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="700" y1="0" x2="700" y2="400" stroke="#e94560" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="1050" y1="0" x2="1050" y2="400" stroke="#e94560" stroke-opacity="0.08" stroke-width="1"/>
  <!-- symbol -->
  <text x="700" y="200" font-family="serif" font-size="120" fill="#e94560" fill-opacity="0.3" text-anchor="middle" dominant-baseline="middle">🦅</text>
  <!-- title -->
  <text x="700" y="300" font-family="system-ui, sans-serif" font-size="48" font-weight="800" fill="#f0f0f0" text-anchor="middle" letter-spacing="4">ASSASSIN'S CREED MIRAGE</text>
  <!-- border -->
  <rect x="3" y="3" width="1394" height="394" fill="none" stroke="#e94560" stroke-opacity="0.3" stroke-width="3"/>
</svg>
