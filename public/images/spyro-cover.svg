<svg xmlns="http://www.w3.org/2000/svg" width="400" height="533" viewBox="0 0 400 533">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0d2e"/>
      <stop offset="100%" style="stop-color:#3b1f6b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="533" fill="url(#bg)"/>
  <rect width="400" height="200" y="0" fill="url(#glow)"/>
  <!-- decorative stars -->
  <circle cx="60" cy="60" r="2" fill="#c4b5fd" fill-opacity="0.6"/>
  <circle cx="150" cy="40" r="1.5" fill="#c4b5fd" fill-opacity="0.5"/>
  <circle cx="280" cy="80" r="2" fill="#c4b5fd" fill-opacity="0.7"/>
  <circle cx="340" cy="30" r="1" fill="#c4b5fd" fill-opacity="0.4"/>
  <circle cx="90" cy="120" r="1.5" fill="#c4b5fd" fill-opacity="0.5"/>
  <circle cx="360" cy="110" r="2" fill="#c4b5fd" fill-opacity="0.6"/>
  <circle cx="220" cy="50" r="1" fill="#c4b5fd" fill-opacity="0.4"/>
  <!-- symbol -->
  <text x="200" y="220" font-family="serif" font-size="100" fill="#7c3aed" fill-opacity="0.7" text-anchor="middle">🐉</text>
  <!-- title -->
  <text x="200" y="340" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#f0f0f0" text-anchor="middle">SPYRO</text>
  <text x="200" y="370" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#c4b5fd" text-anchor="middle">REIGNITED TRILOGY</text>
  <!-- border -->
  <rect x="2" y="2" width="396" height="529" fill="none" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="10" y="10" width="380" height="513" fill="none" stroke="#7c3aed" stroke-opacity="0.2" stroke-width="1"/>
</svg>
